# Конфіг mergeward для цього репо (Р17) — явний, не лише щоб показати
# дефолти, а тому що це testbed-репо: хочемо, щоб пороги були видимі й
# легко покрутити під конкретний тестовий сценарій PR.

enabled_scanners: [gitleaks, semgrep, heuristics]

block_threshold: CRITICAL
review_threshold: MEDIUM

semgrep_config: p/security-audit
ai_authorship_tightens_review: true

# Живі Gemini-креденшли підключені (MERGEWARD_GCP_PROJECT/LOCATION/SA_KEY
# secrets + google-github-actions/auth у workflow YAML) — перевірено
# локально реальним викликом (Vertex AI, test1-449514) на обох напрямках:
# false_positive (безпечний curl|sh у CI-only контексті -> auto_pass) і
# escalate (той самий патерн у production-скрипті -> auto_block).
llm_gray_zone_enabled: true
llm_model: gemini-2.5-flash

ignore_paths:
  - "*.lock"
  - "*/dist/*"
  - "*/node_modules/*"
  - "*/vendor/*"
  - "*.db"
