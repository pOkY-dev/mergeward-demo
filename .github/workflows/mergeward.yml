# Стартує mergeward-граф на кожен push у PR (Р6: "перший" з двох
# workflow — другий, mergeward-resume.yml, резюмить HITL-паузу).
on: pull_request

permissions:
  pull-requests: write

jobs:
  mergeward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # потрібна повна історія для git diff base..head

      # Р4/Р7: Gemini через Google Cloud service account. auth@v2 сам
      # записує ключ у тимчасовий файл і виставляє
      # GOOGLE_APPLICATION_CREDENTIALS на наступні кроки того самого job.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.MERGEWARD_GCP_SA_KEY }}

      - uses: pOkY-dev/mergeward/mergeward@main
        id: mergeward
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ secrets.MERGEWARD_GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.MERGEWARD_GCP_LOCATION }}

      - name: Upload paused session (Р6, лише коли needs_review)
        if: steps.mergeward.outputs.outcome == 'needs_review'
        uses: actions/upload-artifact@v4
        with:
          name: mergeward-session-pr-${{ github.event.pull_request.number }}
          path: mergeward-session.json
          retention-days: 14
